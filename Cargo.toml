[workspace]
members = ["crates/mkw-formats", "crates/mkw-arm64", "crates/mkw-codegen", "crates/mkw-cli", "crates/mkw-runtime"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.10.9"
libloading = "=0.8.9"
